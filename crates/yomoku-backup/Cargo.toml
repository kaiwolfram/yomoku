[package]
name = "yomoku-backup"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
aead-stream = { version = "=0.6.0", default-features = false }
getrandom = "=0.4.3"
zeroize = { version = "=1.9.1", features = ["alloc"] }
