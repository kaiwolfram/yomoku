[package]
name = "yomoku-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
sha2 = "=0.11.1"
serde_json = "=1.0.154"
yomoku-core = { path = "../yomoku-core" }
yomoku-import = { path = "../yomoku-import" }

[dev-dependencies]
yomoku-backup = { path = "../yomoku-backup" }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
