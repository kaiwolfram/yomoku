[package]
name = "yomoku-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "generate-kotlin"
required-features = ["facet_typegen"]

[features]
facet_typegen = ["crux_core/facet_typegen", "yomoku-runtime/facet_typegen", "yomoku-core/facet_typegen"]

[dependencies]
yomoku-core = { path = "../yomoku-core" }
crux_core = "=0.20.0"
yomoku-runtime = { path = "../yomoku-runtime" }
