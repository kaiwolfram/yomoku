[package]
name = "yomoku-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "generate-kotlin"
required-features = ["facet_typegen"]

[features]
storage-measurements = ["yomoku-runtime/storage-measurements"]
facet_typegen = ["crux_core/facet_typegen", "yomoku-runtime/facet_typegen", "yomoku-core/facet_typegen"]

[dependencies]
boltffi = "=0.32.1"
yomoku-core = { path = "../yomoku-core" }
crux_core = "=0.20.0"
yomoku-runtime = { path = "../yomoku-runtime" }
yomoku-analysis = { path = "../yomoku-analysis" }

[dev-dependencies]
yomoku-storage = { path = "../yomoku-storage" }
serde = "=1.0.229"
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
