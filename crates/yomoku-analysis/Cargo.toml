[package]
name = "yomoku-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[example]]
name = "android_app_probe"
crate-type = ["cdylib"]

[dependencies]
yomoku-core = { path = "../yomoku-core" }
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", rev = "5de0410b6edfd428fc510cc9763440772e9619d5" }
regex = "=1.13.1"
sha2 = "=0.11.1"
memmap2 = "=0.9.12"

[dev-dependencies]
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
yomoku-storage = { path = "../yomoku-storage" }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }
