[package]
name = "yomoku-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
storage-measurements = []
facet_typegen = ["crux_core/facet_typegen", "yomoku-core/facet_typegen", "dep:facet"]

[dependencies]
facet = { version = "=0.46.5", optional = true }
crux_core = "=0.20.0"
yomoku-core = { path = "../yomoku-core" }
serde = { version = "=1.0.229", features = ["derive"] }
yomoku-storage = { path = "../yomoku-storage" }
yomoku-import = { path = "../yomoku-import" }

[dev-dependencies]
yomoku-analysis = { path = "../yomoku-analysis" }
rusqlite = { version = "=0.42.0", default-features = false, features = ["bundled"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2"] }
